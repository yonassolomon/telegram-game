<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo2Bingo Admin</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'dashboard/css/admin.css' %}">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <h2>Bingo2Bingo</h2>
      <span>Admin Panel</span>
    </div>
    <nav class="sidebar-nav">
      <a href="{% url 'dashboard:overview' %}" class="{% if request.resolver_match.url_name == 'overview' %}active{% endif %}">
        <span class="icon">📊</span> Overview
      </a>
      <a href="{% url 'dashboard:players' %}" class="{% if request.resolver_match.url_name == 'players' %}active{% endif %}">
        <span class="icon">👥</span> Players
      </a>
      <a href="{% url 'dashboard:rooms' %}" class="{% if request.resolver_match.url_name == 'rooms' or request.resolver_match.url_name == 'room_detail' %}active{% endif %}">
        <span class="icon">🏠</span> Rooms
      </a>
      <a href="{% url 'dashboard:live' %}" class="{% if request.resolver_match.url_name == 'live' %}active{% endif %}">
        <span class="icon">🔴</span> Live Games
      </a>
      <a href="{% url 'dashboard:arena' %}" class="{% if request.resolver_match.url_name == 'arena' %}active{% endif %}">
        <span class="icon">🏟️</span> Arena
      </a>
      <a href="{% url 'dashboard:transactions' %}" class="{% if request.resolver_match.url_name == 'transactions' %}active{% endif %}">
        <span class="icon">💎</span> Transactions
      </a>
      <a href="{% url 'dashboard:logs' %}" class="{% if request.resolver_match.url_name == 'logs' %}active{% endif %}">
        <span class="icon">📋</span> Audit Logs
      </a>
      <a href="{% url 'dashboard:admin_deposits' %}" class="{% if request.resolver_match.url_name == 'admin_deposits' %}active{% endif %}">
        <span class="icon">💰</span> Deposits
      </a>
      <a href="{% url 'dashboard:admin_withdrawals' %}" class="{% if request.resolver_match.url_name == 'admin_withdrawals' %}active{% endif %}">
        <span class="icon">💸</span> Withdrawals
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user">{{ request.user.username }}</div>
      <a href="{% url 'dashboard:logout' %}">Logout</a>
    </div>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
  <div id="toast-container" style="position:fixed;bottom:24px;right:24px;z-index:999;"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
