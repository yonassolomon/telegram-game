<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a12">
  <title>Bingo2Bingo</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'webapp/css/style.css' %}">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="{% static 'webapp/js/telegram.js' %}"></script>
</head>
<body>
  {% block content %}{% endblock %}
  <div id="toast-container"></div>
  {% block scripts %}{% endblock %}
  <script>
  (function() {
    var params = new URLSearchParams(location.search);
    var tgId = params.get('tg_id');
    if (tgId) { localStorage.setItem('tg_id', tgId); }
    else { tgId = localStorage.getItem('tg_id'); }
    if (tgId && !params.has('tg_id')) {
      var sep = location.search ? '&' : '?';
      history.replaceState(null, '', location.pathname + location.search + sep + 'tg_id=' + tgId);
    }
    if (tgId) {
      document.querySelectorAll('a[href]').forEach(function(a) {
        try {
          var u = new URL(a.href, location.origin);
          if ((u.host === location.host || u.host === '') && !u.searchParams.has('tg_id')) {
            u.searchParams.set('tg_id', tgId);
            a.href = u.pathname + u.search + u.hash;
          }
        } catch(e) {}
      });
    }
    window.getTgId = function() { return tgId || localStorage.getItem('tg_id'); };
  })();
  </script>
</body>
</html>
