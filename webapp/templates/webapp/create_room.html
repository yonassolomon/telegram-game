{% extends 'webapp/base.html' %}
{% block content %}
<div class="top-bar">
  <a href="{% url 'arena:lobby' %}" class="back-btn">← Back</a>
  <div class="title">Create Room</div>
  <div style="width:50px;"></div>
</div>

<div class="container">
  <form method="POST" action="{% url 'webapp:create_room' %}">
    {% csrf_token %}
    <div class="card">
      <div class="card-header">🔒 Room Type</div>
      <div class="tabs" id="room-type-tabs">
        <button type="button" class="tab active" data-type="public" style="flex:1;">🌍 Public</button>
        <button type="button" class="tab" data-type="private" style="flex:1;">🔐 Private</button>
      </div>
      <input type="hidden" name="room_type" id="room_type" value="public">
      <div style="font-size:11px;color:var(--text-secondary);margin-top:6px;" id="room-type-hint">Anyone can see and join this room</div>
    </div>

    <div class="card">
      <div class="card-header">💰 Entry Fee</div>
      <div class="tabs" id="fee-tabs" style="flex-wrap:wrap;">
        <button type="button" class="tab active" data-fee="5">5 💰</button>
        <button type="button" class="tab" data-fee="10">10 💰</button>
        <button type="button" class="tab" data-fee="20">20 💰</button>
        <button type="button" class="tab" data-fee="50">50 💰</button>
        <button type="button" class="tab" data-fee="100">100 💰</button>
        <button type="button" class="tab" data-fee="200">200 💰</button>
        <button type="button" class="tab" data-fee="500">500 💰</button>
      </div>
      <input type="hidden" name="entry_fee" id="entry_fee" value="5">
    </div>

    <div class="card">
      <div class="card-header">👥 Max Players</div>
      <div class="tabs" id="size-tabs">
        <button type="button" class="tab active" data-size="2">2</button>
        <button type="button" class="tab" data-size="3">3</button>
        <button type="button" class="tab" data-size="4">4</button>
        <button type="button" class="tab" data-size="5">5</button>
        <button type="button" class="tab" data-size="6">6</button>
        <button type="button" class="tab" data-size="8">8</button>
        <button type="button" class="tab" data-size="10">10</button>
      </div>
      <input type="hidden" name="max_players" id="max_players" value="2">
    </div>

    <div class="card" style="text-align:center;">
      <div style="color:var(--text-secondary);font-size:13px;">ደራሽ / Total Prize Pool</div>
      <div style="font-size:28px;font-weight:800;color:var(--neon-gold);" id="prize-display">10 💰</div>
    </div>

    <button type="submit" class="btn btn-gold">🎯 Create Room</button>
  </form>
</div>

<script>
(function() {
  var feeVal = 5, sizeVal = 2;
  function update() {
    document.getElementById('prize-display').textContent = (feeVal * sizeVal) + ' 💰';
    document.getElementById('entry_fee').value = feeVal;
    document.getElementById('max_players').value = sizeVal;
  }
  document.getElementById('fee-tabs').addEventListener('click', function(e) {
    if (e.target.classList.contains('tab')) {
      feeVal = parseInt(e.target.dataset.fee);
      document.querySelectorAll('#fee-tabs .tab').forEach(function(t){t.classList.remove('active')});
      e.target.classList.add('active');
      update();
    }
  });
  document.getElementById('size-tabs').addEventListener('click', function(e) {
    if (e.target.classList.contains('tab')) {
      sizeVal = parseInt(e.target.dataset.size);
      document.querySelectorAll('#size-tabs .tab').forEach(function(t){t.classList.remove('active')});
      e.target.classList.add('active');
      update();
    }
  });
  document.getElementById('room-type-tabs').addEventListener('click', function(e) {
    if (e.target.classList.contains('tab')) {
      var type = e.target.dataset.type;
      document.querySelectorAll('#room-type-tabs .tab').forEach(function(t){t.classList.remove('active')});
      e.target.classList.add('active');
      document.getElementById('room_type').value = type;
      document.getElementById('room-type-hint').textContent =
        type === 'private' ? 'Only players with the room code can join' : 'Anyone can see and join this room';
    }
  });
})();
</script>
{% endblock %}
